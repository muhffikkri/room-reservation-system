services:
    frontend:
        image: node:22
        container_name: simfasilitas-frontend
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - frontend_modules:/var/www/node_modules
        command: sh -c "npm ci && npm run build"

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: simfasilitas-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - vendor:/var/www/vendor
        depends_on:
            db:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        container_name: simfasilitas-nginx
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            - ./:/var/www:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: simfasilitas-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${DB_ROOT_PASSWORD}",
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: simfasilitas-cloudflared
        restart: unless-stopped
        command: tunnel --no-autoupdate run
        environment:
            TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
    mysql_data:
    vendor:
    frontend_modules:
